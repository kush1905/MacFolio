services:
  postgres:
    image: postgres:16-alpine
    container_name: macfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: macfolio
      POSTGRES_PASSWORD: macfolio
      POSTGRES_DB: macfolio
    ports:
      - "5433:5432"
    volumes:
      - macfolio_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macfolio -d macfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  macfolio_pg:
